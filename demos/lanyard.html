<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lanyard · Hanging Badge</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  :root{
    --ink:#1a1a1a; --ink-soft:#3a3a3a; --ink-dim:#9a9a9a;
    --line:#e6e6e6; --bg:#ffffff; --stage:#f7f6f4;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Helvetica Neue","Microsoft YaHei",sans-serif;
    --r-card:28px; --r-box:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
  }
  .doc{width:100%;max-width:600px}
  h1{font-size:27px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
  .sub{font-size:15px;color:var(--ink-dim);line-height:1.7;margin-bottom:26px}
  .sub b{color:var(--ink-soft);font-weight:600}

  .stage-card{background:var(--stage);border-radius:var(--r-card);padding:18px 18px 16px}
  .cap{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.04em;padding:4px 8px 16px}
  #stageArea{position:relative;height:clamp(420px,58vh,540px)}
  #lanyardCanvas{display:block;width:100%;height:100%;border-radius:var(--r-box);touch-action:none;cursor:grab}
  #lanyardCanvas.drag{cursor:grabbing}

  .controls{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 4px}
  .ad-label{font-family:var(--mono);font-size:12px;color:var(--ink-dim);flex:1;line-height:1.6}
  .ad-label b{color:var(--ink);font-weight:600}
  .ad-replay{margin-left:auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
       color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:50%;cursor:pointer;
       transition:.15s;flex:0 0 auto}
  .ad-replay:hover{background:#ececee;color:var(--ink)}
  .ad-replay:active{transform:rotate(-40deg)}
  .ad-replay svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
<article class="doc">
  <h1>Lanyard</h1>
  <p class="sub">挂绳吊牌:绳链 + <b>双质点刚性卡片</b>,同一套 Verlet。抓住卡片拖拽、甩动,松手带惯性;静止后渲染循环<b>自动休眠</b>。</p>

  <div class="stage-card">
    <span class="cap">VERLET LANYARD · GRAB THE BADGE · SLEEP ON SETTLE</span>
    <div id="stageArea"><canvas id="lanyardCanvas"></canvas></div>
    <div class="controls">
      <span class="ad-label" id="status"></span>
      <button class="ad-replay" id="reset" title="重置" aria-label="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>
</article>

<script>
'use strict'
// =============================================================================
// Lanyard — 挂绳吊牌。rope.html 的 Verlet 架构 + 两个新点子:
//   • 卡片 = 两个质点(挂孔 A、下沿 B)+ 一根刚性 stick,朝向 = A→B 向量
//   • 质点带 invMass:卡片比绳重,摆动有分量
//   • 拖拽时钉住挂孔,松手用 100ms 指针采样窗注入速度(甩动惯性)
// =============================================================================

// === scheduler ===============================================================
let scheduledRender = false
function scheduleRender() {
  if (scheduledRender) return
  scheduledRender = true
  requestAnimationFrame(function renderAndMaybeScheduleAnotherRender(now) {
    scheduledRender = false
    if (render(now)) scheduleRender()
  })
}

// === config ==================================================================
const msPerStep = 4
const gravity = 0.032
const damping = 0.9985
const iterations = 6
const segmentCount = 14
const cardW = 120, cardH = 150, holeInset = 12
const cardStick = cardH - holeInset * 2      // 挂孔到卡片下沿锚点的刚性距离
const QUIET_FRAMES_TO_SLEEP = 12
const SLEEP_EPSILON = 0.02
const MAX_THROW = 25                          // px/step,松手速度上限

// === DOM =====================================================================
const canvas = document.getElementById('lanyardCanvas')
const ctx = canvas.getContext('2d', { alpha: false })
const statusEl = document.getElementById('status')
const STAGE_BG = '#f7f6f4'

// === state ===================================================================
const points = []
const sticks = []
let cardA = null, cardB = null               // 挂孔 / 卡片下沿
let dragging = null                          // {pointerId, dx, dy}
let samples = []                             // 指针采样(松手算速度)
let animatedUntilTime = null
let quietFrames = 0

function makePoint(x, y, invMass, margin) {
  return { x, y, oldX: x, oldY: y, invMass, margin, pinned: false, dragPin: false }
}
function pinAt(p, x, y) { p.x = x; p.y = y; p.oldX = x; p.oldY = y }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(v, hi)) }

// === setup ===================================================================
function resizeCanvas() {
  const dpr = Math.max(1, window.devicePixelRatio || 1)
  canvas.width = Math.floor(canvas.clientWidth * dpr)
  canvas.height = Math.floor(canvas.clientHeight * dpr)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  for (const p of points) constrainToBounds(p)
}

function initLanyard() {
  const w = canvas.clientWidth, h = canvas.clientHeight
  const anchorX = w / 2, anchorY = 18
  const ropeLen = h * 0.30
  const spacing = ropeLen / segmentCount

  points.length = 0
  sticks.length = 0

  const anchor = makePoint(anchorX, anchorY, 0, 6)
  anchor.pinned = true
  points.push(anchor)
  for (let i = 1; i <= segmentCount; i++) {
    const p = makePoint(anchorX, anchorY + spacing * i, 1, 6)
    points.push(p)
    sticks.push({ p0: points[i - 1], p1: p, length: spacing })
  }
  cardA = points[segmentCount]               // 绳末点即挂孔
  cardA.invMass = 0.45
  cardA.margin = 40
  cardB = makePoint(anchorX, cardA.y + cardStick, 0.45, 40)
  points.push(cardB)
  sticks.push({ p0: cardA, p1: cardB, length: cardStick })

  // 初始给一点侧向位移,加载即有一段自然摆动,随后休眠
  cardB.x += 26
  cardB.oldX = cardB.x
}

// === physics (per 4ms step) ==================================================
function constrainToBounds(p) {
  const m = p.margin
  const maxX = canvas.clientWidth - m, maxY = canvas.clientHeight - m
  if (p.x < m) { p.x = m; p.oldX = m } else if (p.x > maxX) { p.x = maxX; p.oldX = maxX }
  if (p.y < m) { p.y = m; p.oldY = m } else if (p.y > maxY) { p.y = maxY; p.oldY = maxY }
}

function physicsStep() {
  for (const p of points) {
    if (p.pinned || p.dragPin) continue
    const vx = (p.x - p.oldX) * damping
    const vy = (p.y - p.oldY) * damping
    p.oldX = p.x
    p.oldY = p.y
    p.x += vx
    p.y += vy + gravity
    constrainToBounds(p)
  }
  for (let it = 0; it < iterations; it++) {
    for (const s of sticks) {
      const i0 = (s.p0.pinned || s.p0.dragPin) ? 0 : s.p0.invMass
      const i1 = (s.p1.pinned || s.p1.dragPin) ? 0 : s.p1.invMass
      const invSum = i0 + i1
      if (!invSum) continue
      const dx = s.p1.x - s.p0.x
      const dy = s.p1.y - s.p0.y
      const dist = Math.hypot(dx, dy) || 1e-4
      const f = (s.length - dist) / (dist * invSum)
      if (i0) { s.p0.x -= dx * f * i0; s.p0.y -= dy * f * i0; constrainToBounds(s.p0) }
      if (i1) { s.p1.x += dx * f * i1; s.p1.y += dy * f * i1; constrainToBounds(s.p1) }
    }
  }
}

// === draw ====================================================================
function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight
  ctx.fillStyle = STAGE_BG
  ctx.fillRect(0, 0, w, h)

  // 挂绳:靛蓝渐变织带 + 细高光
  ctx.lineCap = 'round'
  ctx.lineJoin = 'round'
  const g = ctx.createLinearGradient(points[0].x, points[0].y, cardA.x, cardA.y)
  g.addColorStop(0, '#6E63E8')
  g.addColorStop(1, '#9B93FF')
  traceRope()
  ctx.lineWidth = 5
  ctx.strokeStyle = g
  ctx.stroke()
  traceRope()
  ctx.lineWidth = 1.6
  ctx.strokeStyle = 'rgba(255,255,255,0.32)'
  ctx.stroke()

  // 顶部固定点
  ctx.fillStyle = '#1a1a1a'
  ctx.beginPath()
  ctx.arc(points[0].x, points[0].y, 4.5, 0, Math.PI * 2)
  ctx.fill()

  drawCard()
}

function traceRope() {
  ctx.beginPath()
  ctx.moveTo(points[0].x, points[0].y)
  for (let i = 1; i < segmentCount; i++) {
    const midX = (points[i].x + points[i + 1].x) / 2
    const midY = (points[i].y + points[i + 1].y) / 2
    ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY)
  }
  ctx.lineTo(cardA.x, cardA.y)
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}

function drawCard() {
  const angle = Math.atan2(cardB.y - cardA.y, cardB.x - cardA.x) - Math.PI / 2
  ctx.save()
  ctx.translate(cardA.x, cardA.y)
  ctx.rotate(angle)

  // 卡身:白底细描边,无投影
  roundRectPath(-cardW / 2, -holeInset, cardW, cardH, 14)
  ctx.fillStyle = '#ffffff'
  ctx.fill()
  ctx.lineWidth = 1.5
  ctx.strokeStyle = '#e6e6e6'
  ctx.stroke()

  // 挂孔(冲出的洞)
  ctx.beginPath()
  ctx.arc(0, 0, 5, 0, Math.PI * 2)
  ctx.fillStyle = STAGE_BG
  ctx.fill()
  ctx.lineWidth = 2
  ctx.strokeStyle = '#c9c7c2'
  ctx.stroke()

  // 徽章内容:头像 + 文本条 + 页脚
  ctx.fillStyle = '#6E63E8'
  ctx.beginPath()
  ctx.arc(0, 46, 19, 0, Math.PI * 2)
  ctx.fill()
  ctx.fillStyle = '#ececea'
  roundRectPath(-36, 78, 72, 9, 4.5); ctx.fill()
  roundRectPath(-24, 94, 48, 9, 4.5); ctx.fill()
  ctx.fillStyle = '#9a9a9a'
  ctx.font = '600 9px "SF Mono", ui-monospace, Menlo, monospace'
  ctx.textAlign = 'center'
  ctx.fillText('PLAYGROUND · 2026', 0, 126)

  ctx.restore()
}

let statusCache = null
function setStatus(html) {
  if (html === statusCache) return
  statusCache = html
  statusEl.innerHTML = html
}

// === render ==================================================================
function render(now) {
  let until = animatedUntilTime ?? now
  let steps = Math.floor((now - until) / msPerStep)
  if (steps > 64) { steps = 64; until = now - 64 * msPerStep }
  until += steps * msPerStep

  for (let i = 0; i < steps; i++) physicsStep()

  if (steps > 0) {
    let maxV = 0
    for (const p of points) maxV = Math.max(maxV, Math.abs(p.x - p.oldX), Math.abs(p.y - p.oldY))
    quietFrames = maxV < SLEEP_EPSILON ? quietFrames + 1 : 0
  }

  draw()

  const still = dragging != null || quietFrames < QUIET_FRAMES_TO_SLEEP
  setStatus(still ? '抓住吊牌甩一甩 · sim <b>running</b>' : '抓住吊牌甩一甩 · sim idle')
  animatedUntilTime = still ? until : null
  return still
}

// === events ==================================================================
function pointerPos(e) {
  const r = canvas.getBoundingClientRect()
  return { x: e.clientX - r.left, y: e.clientY - r.top }
}
function wake() { quietFrames = 0; scheduleRender() }

// 命中判定:把指针换到卡片局部坐标(A 为原点,A→B 为纵轴)
function hitTestCard(pos) {
  const dx = cardB.x - cardA.x, dy = cardB.y - cardA.y
  const len = Math.hypot(dx, dy) || 1e-4
  const ux = dx / len, uy = dy / len
  const px = pos.x - cardA.x, py = pos.y - cardA.y
  const localY = px * ux + py * uy
  const localX = px * -uy + py * ux
  return Math.abs(localX) <= cardW / 2 + 6 && localY >= -holeInset - 6 && localY <= cardH - holeInset + 6
}

canvas.addEventListener('pointerdown', e => {
  const pos = pointerPos(e)
  if (!hitTestCard(pos)) return
  dragging = { pointerId: e.pointerId, dx: cardA.x - pos.x, dy: cardA.y - pos.y }
  cardA.dragPin = true
  samples = [{ x: pos.x, y: pos.y, time: performance.now() }]
  canvas.setPointerCapture(e.pointerId)
  canvas.classList.add('drag')
  e.preventDefault()
  wake()
}, { passive: false })

canvas.addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== dragging.pointerId) return
  const pos = pointerPos(e)
  pinAt(cardA,
    clamp(pos.x + dragging.dx, 20, canvas.clientWidth - 20),
    clamp(pos.y + dragging.dy, 20, canvas.clientHeight - 20))
  samples.push({ x: pos.x, y: pos.y, time: performance.now() })
  if (samples.length > 20) samples.shift()
  e.preventDefault()
  wake()
}, { passive: false })

function endDrag(e) {
  if (!dragging || e.pointerId !== dragging.pointerId) return
  // 松手:用最近 ~100ms 的采样注入速度(px/ms → px/step),让吊牌被甩出去
  const now = performance.now()
  let i = samples.length - 1
  while (i > 0 && now - samples[i].time <= 100) i--
  const last = samples[samples.length - 1]
  const dt = now - samples[i].time
  if (dt > 16 && last) {
    const vx = clamp((last.x - samples[i].x) / dt * msPerStep, -MAX_THROW, MAX_THROW)
    const vy = clamp((last.y - samples[i].y) / dt * msPerStep, -MAX_THROW, MAX_THROW)
    cardA.oldX = cardA.x - vx
    cardA.oldY = cardA.y - vy
  }
  cardA.dragPin = false
  dragging = null
  samples = []
  canvas.classList.remove('drag')
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId)
  wake()
}
canvas.addEventListener('pointerup', endDrag)
canvas.addEventListener('pointercancel', endDrag)

window.addEventListener('resize', () => { resizeCanvas(); wake() })
document.getElementById('reset').addEventListener('click', () => { initLanyard(); wake() })

// === boot ====================================================================
resizeCanvas()
initLanyard()
scheduleRender()
</script>
</body>
</html>
